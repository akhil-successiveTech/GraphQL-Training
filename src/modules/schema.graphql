type Query {
    messages(id: ID):[Message!]!
    
    users: [User!]!
    user(id: ID!): User

    posts: [Post!]!
    post(id: ID!): Post

    comments: [Comment!]!
    comment(id: ID!): Comment
}
# for post,put,patch,delete
type Mutation {
    postMessage(content:String!,author:String!):Message!
}